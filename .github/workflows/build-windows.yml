
name: Compilar MangoHud Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preparar Windows y compiladores
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-mako
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-vulkan-loader

      - name: Descargar MangoHud original
        run: |
          git clone --depth 1 \
            https://github.com/flightlessmango/MangoHud.git source

      - name: Adaptar biblioteca Vulkan
        run: |
          cd source
          sed -i \
            "s/cc.find_library('vulkan', required: true)/cc.find_library('vulkan-1', required: true)/" \
            meson.build

      - name: Adaptar libdrm para Windows
        run: |
          cd source
          python - <<'PY'
          from pathlib import Path

          file = Path("meson.build")
          content = file.read_text()

          old = "libdrm_dep = dependency('libdrm')"
          new = """if host_machine.system() == 'windows'
            libdrm_dep = null_dep
          else
            libdrm_dep = dependency('libdrm')
          endif"""

          assert old in content, "No se encontro libdrm"
          file.write_text(content.replace(old, new, 1))
          PY

      - name: Corregir rutas de Windows
        run: |
          cd source
          python - <<'PY'
          from pathlib import Path

          file = Path(
              "mangohud-next/server/metrics/fdinfo.cpp"
          )
          code = file.read_text()

          fixes = {
              "fds.push_back(entry.path().filename());":
              "fds.push_back(entry.path().filename().string());",

              "const std::string filename = path.filename();":
              "const std::string filename = path.filename().string();"
          }

          for original, fixed in fixes.items():
              if original not in code:
                  raise SystemExit(
                      "No se encontro: " + original
                  )
              code = code.replace(original, fixed)

          file.write_text(code)
          print("Rutas corregidas")
          PY

      - name: Separar componente GPU de Linux
        run: |
          cd source
          python - <<'PY'
          from pathlib import Path

          root = Path("meson.build")
          code = root.read_text()

          old = "subdir('mangohud-next/legacy_gpu_wrapper')"
          new = """if host_machine.system() == 'linux'
            subdir('mangohud-next/legacy_gpu_wrapper')
            legacy_gpu_link = mangohud_legacy_gpu_wrapper
          else
            legacy_gpu_link = []
          endif"""

          assert old in code
          root.write_text(code.replace(old, new, 1))

          src = Path("src/meson.build")
          code = src.read_text()

          old = "link_with: mangohud_legacy_gpu_wrapper,"
          new = "link_with: legacy_gpu_link,"

          assert old in code
          src.write_text(code.replace(old, new, 1))

          print("Componente Linux separado")
          PY

      - name: Corregir DirectX 12 en Windows
        run: |
          cd source
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("src/win/d3d12_hook.h"),
              Path("src/win/kiero.cpp")
          ]

          original = (
              '#include "/usr/i686-w64-mingw32/'
              'include/d3d12.h"'
          )

          for file in files:
              code = file.read_text()
              if original not in code:
                  raise SystemExit(
                      f"No se encontro la ruta en {file}"
                  )
              code = code.replace(
                  original, "#include <d3d12.h>"
              )
              file.write_text(code)
              print(f"Corregido: {file}")
          PY


      - name: Configurar compilacion
        run: |
          cd source
          meson setup build64 \
            --buildtype=release \
            -Dtests=disabled \
            -Dwith_mangohud_next=false \
            -Dwith_x11=disabled \
            -Dwith_wayland=disabled \
            -Dwith_dbus=disabled \
            -Dwith_xnvctrl=disabled \
            -Dmangoplot=disabled


      - name: Compilar MangoHud
        run: |
          cd source
          meson compile -C build64

      - name: Guardar archivos
        run: |
          mkdir -p resultado
          find source/build64 -type f \
            \( -iname '*.dll' -o -iname '*.exe' \) \
            -exec cp '{}' resultado/ \;
          test -n "$(ls -A resultado)"

      - name: Descargar resultado
        uses: actions/upload-artifact@v4
        with:
          name: MangoHud-Windows-Experimental
          path: resultado/
          if-no-files-found: error
