
name: Compilar MangoHud Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Instalar herramientas
        run: |
          pacman -Syu --noconfirm \
            mingw-w64-gcc meson ninja \
            python-mako glslang \
            mingw-w64-headers git \
            ca-certificates pkgconf

      - name: Descargar MangoHud original
        uses: actions/checkout@v4
        with:
          repository: flightlessmango/MangoHud
          path: source
          submodules: recursive

      - name: Configurar Windows x64
        working-directory: source
        run: |
          meson setup \
            --cross-file mingw64.txt \
            build64 --buildtype=release

      - name: Compilar
        working-directory: source
        run: ninja -C build64

      - name: Buscar archivos compilados
        shell: bash
        run: |
          mkdir -p resultado
          find source/build64 -type f \
            \( -iname '*.dll' -o -iname '*.exe' \) \
            -exec cp '{}' resultado/ \;
          test -n "$(ls -A resultado)"

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: MangoHud-Windows-x64
          path: resultado/
          if-no-files-found: error
