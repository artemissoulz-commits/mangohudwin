name: MangoHud Windows - Source Port v1 (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Extraer el codigo actualizado
        shell: pwsh
        run: |
          $zip = "MangoHud-Windows-Source-Port-v1.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "No se encuentra $zip en la raiz del repositorio"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath "source" -Force
          if (-not (Test-Path -LiteralPath "source/meson.build")) {
            throw "El ZIP no contiene meson.build en su raiz"
          }

      - name: Preparar herramientas de Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-mako
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-vulkan-loader

      - name: Corregir Vulkan para Windows
        shell: msys2 {0}
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path

          meson_file = Path('meson.build')
          code = meson_file.read_text(encoding='utf-8')
          original = "vulkan_lib = cc.find_library('vulkan', required: true)"
          replacement = """if host_machine.system() == 'windows'
            vulkan_lib = cc.find_library('vulkan-1', required: true)
          else
            vulkan_lib = cc.find_library('vulkan', required: true)
          endif"""
          if code.count(original) != 1:
              raise SystemExit('No se encontro exactamente una declaracion de la biblioteca Vulkan. Revisar el codigo fuente.')
          meson_file.write_text(code.replace(original, replacement, 1), encoding='utf-8')
          print('Biblioteca Vulkan adaptada para Windows (vulkan-1).')
          PY

      - name: Configurar la compilacion
        shell: msys2 {0}
        working-directory: source
        run: >-
          meson setup build64 --buildtype=release
          -Dtests=disabled -Dwith_mangohud_next=false
          -Dwith_x11=disabled -Dwith_wayland=disabled
          -Dwith_dbus=disabled -Dwith_xnvctrl=disabled
          -Dmangoplot=disabled

      - name: Compilar codigo actualizado
        shell: msys2 {0}
        working-directory: source
        run: meson compile -C build64

      - name: Guardar resultados experimentales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangoHud-Windows-diagnostico
          path: |
            source/build64/meson-logs/meson-log.txt
            source/build64/src/*.dll
          if-no-files-found: warn
