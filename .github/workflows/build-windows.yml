
name: MangoHud Windows - MSVC x64 (D3D11-D3D12-Vulkan)

on:
  push:
    branches:
      - windows-opengl-wgl
      - windows-opengl-wgl-package-fix
      - fix/opengl-control-attach-running-process
      - fix/control-auto-focus-ui-sharp-logo
      - fix/control-d3d11-12-autoload-ui-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'


      - name: Install glslang for shader compilation
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-glslang

      - name: Add glslang to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSYS2_LOCATION)) {
            throw 'La acción MSYS2 no devolvió su ubicación de instalación.'
          }
          $glslangDir = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $glslangExe = Join-Path $glslangDir 'glslangValidator.exe'
          if (-not (Test-Path -LiteralPath $glslangExe)) {
            Write-Host "No se encontró glslangValidator en: $glslangDir"
            Write-Host "Ubicación MSYS2: $env:MSYS2_LOCATION"
            Get-ChildItem -LiteralPath $env:MSYS2_LOCATION -Filter 'glslangValidator.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw 'No se encontró glslangValidator dentro de MSYS2.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $glslangDir
          & $glslangExe --version


      - name: Configure Microsoft C++ x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Extract Windows source package
        shell: pwsh
        run: |
          $zip = 'MangoHud-Windows-Source-Port-v2.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "No se encuentra $zip en la raíz del repositorio"
          }
          if (Test-Path -LiteralPath 'source') {
            Remove-Item -LiteralPath 'source' -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip -DestinationPath 'source' -Force
          if (-not (Test-Path -LiteralPath 'source/meson.build')) {
            throw 'El ZIP no es válido: falta source/meson.build en su raíz'
          }
          git -C source init
          git -C source add --all
          git -C source -c user.name='GitHub Actions' -c user.email='actions@github.local' commit -m 'Source archive snapshot'
          git -C source tag v0.8.3

      - name: Apply OpenGL WGL hook and launcher
        shell: pwsh
        working-directory: source
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/windows-opengl/apply-opengl-patch.ps1"


      - name: Fix Winsock2 include order
        shell: pwsh
        working-directory: source
        run: |
          $path = 'src/net_win32.cpp'
          $content = [System.IO.File]::ReadAllText($path)

          $alreadyFixed = $content -match '(?s)\A#ifndef WIN32_LEAN_AND_MEAN\s+#define WIN32_LEAN_AND_MEAN'

          if (-not $alreadyFixed) {
            $pattern = '(?s)\A#include "net\.h"\r?\n#include <winsock2\.h>\r?\n#include <ws2tcpip\.h>\r?\n#include <windows\.h>'

            $replacement = @'
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <windows.h>
          #include "net.h"
          '@

            $regex = [regex]::new($pattern)

            if (-not $regex.IsMatch($content)) {
              throw 'No se reconoce el orden original de includes en net_win32.cpp'
            }

            $content = $regex.Replace($content, $replacement.TrimEnd(), 1)

            [System.IO.File]::WriteAllText(
              $path,
              $content,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Write-Host 'Orden de Winsock corregido.'


      - name: Fix missing C++ stream header
        shell: pwsh
        working-directory: source
        run: |
          $path = 'src/fps_metrics.h'

          if (-not (Test-Path -LiteralPath $path)) {
            throw "No se encuentra $path"
          }

          $text = [System.IO.File]::ReadAllText($path)

          if ($text -notmatch '(?m)^#include\s*<sstream>\s*$') {
            $needle = '#include <iomanip>'

            if (-not $text.Contains($needle)) {
              throw 'No se encontró el include <iomanip>'
            }

            $text = $text.Replace(
              $needle,
              $needle + "`r`n#include <sstream>"
            )

            [System.IO.File]::WriteAllText(
              $path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Write-Host 'Cabecera sstream comprobada.'
          Select-String -Path $path -Pattern 'iomanip|sstream'

      - name: Fix Windows IP Helper headers
        shell: pwsh
        working-directory: source
        run: |
          $path = 'src/net_win32.cpp'
          $content = [System.IO.File]::ReadAllText($path)

          $marker = 'std::unique_ptr<Net> net = nullptr;'
          $index = $content.IndexOf($marker)

          if ($index -lt 0) {
            throw 'No se encontró el inicio del código de net_win32.cpp'
          }

          $body = $content.Substring($index)

          $header = @'
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <windows.h>
          #include <iphlpapi.h>
          #include "net.h"
          #include <spdlog/spdlog.h>

          '@

          [System.IO.File]::WriteAllText(
            $path,
            $header + $body,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host 'Cabeceras IP Helper corregidas.'
          Select-String -Path $path -Pattern 'winsock2|iphlpapi|netioapi'
      - name: Fix D3D11 DXGI header order
        shell: pwsh
        working-directory: source
        run: |
          $path = 'src/win/d3d11_hook.h'
          $content = [System.IO.File]::ReadAllText($path)
          $needle = '#include <d3d11.h>'

          if (-not $content.Contains('#include <dxgi.h>')) {
            if (-not $content.Contains($needle)) {
              throw 'No se encontró #include <d3d11.h> en d3d11_hook.h'
            }

            $content = $content.Replace(
              $needle,
              "#include <dxgi.h>`r`n$needle"
            )

            [System.IO.File]::WriteAllText(
              $path,
              $content,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Get-Content $path -TotalCount 8
      - name: Avoid DXGI SDK export name conflicts
        shell: pwsh
        working-directory: source
        run: |
          $path = 'src/proxy/dxgi_proxy.cpp'
          $content = [System.IO.File]::ReadAllText($path)

          $pattern = '(?m)^#if KIERO_INCLUDE_D3D11\r?\n#include "\.\./win/d3d11_hook\.h"\r?\n#endif\r?\n#if KIERO_INCLUDE_D3D12\r?\n#include "\.\./win/d3d12_hook\.h"\r?\n#endif'

          $replacement = @'
          // Rename SDK declarations only; keep proxy exports unchanged.
          #define CreateDXGIFactory MangoHudSdk_CreateDXGIFactory
          #define CreateDXGIFactory1 MangoHudSdk_CreateDXGIFactory1
          #define CreateDXGIFactory2 MangoHudSdk_CreateDXGIFactory2
          #define DXGIGetDebugInterface1 MangoHudSdk_DXGIGetDebugInterface1

          #if KIERO_INCLUDE_D3D11
          #include "../win/d3d11_hook.h"
          #endif
          #if KIERO_INCLUDE_D3D12
          #include "../win/d3d12_hook.h"
          #endif

          #undef CreateDXGIFactory
          #undef CreateDXGIFactory1
          #undef CreateDXGIFactory2
          #undef DXGIGetDebugInterface1
          '@

          $updated = [regex]::Replace($content, $pattern, $replacement, 1)

          if ($updated -eq $content) {
            if (-not $content.Contains('MangoHudSdk_CreateDXGIFactory')) {
              throw 'No se encontró el bloque DirectX esperado.'
            }
            Write-Host 'El arreglo DXGI ya estaba aplicado.'
          } else {
            [System.IO.File]::WriteAllText(
              $path,
              $updated,
              [System.Text.UTF8Encoding]::new($false)
            )
            Write-Host 'Conflictos de nombres DXGI corregidos.'
          }

          Select-String -Path $path -Pattern 'MangoHudSdk_|__declspec\(dllexport\)'
      - name: Run static Windows port checks
        shell: pwsh
        working-directory: source
        run: |
          Write-Host '--- Windows static check definitions ---'
          Get-Content -LiteralPath 'dev/check_windows_port.py'
          Write-Host '--- Running static checks ---'
          python dev/check_windows_port.py

          $workflowPath = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\build-windows.yml'

          if (-not (Test-Path -LiteralPath $workflowPath)) {
            throw "No se encuentra el workflow: $workflowPath"
          }

          $workflow = Get-Content -LiteralPath $workflowPath -Raw

          foreach ($required in @(
            'MangoHud-Windows-Source-Port-v2.zip',
            'MangoHud-Windows-v2-prueba-NO-INSTALAR',
            'ilammy/msvc-dev-cmd@v1',
            'meson compile -C build-msvc'
          )) {
            if (-not $workflow.Contains($required)) {
              throw "Falta en el workflow: $required"
            }
          }

          Write-Host 'Comprobaciones estáticas completadas correctamente.'


      - name: Install Meson, Ninja and Mako
        shell: pwsh
        run: python -m pip install --upgrade meson ninja mako

      - name: Configure MSVC x64 build
        shell: pwsh
        working-directory: source
        run: |
          meson setup build-msvc --buildtype=release --backend=ninja `
            -Db_vscrt=mt `
            -Dtests=disabled `
            -Dinclude_doc=false

      - name: Compile Windows targets (MSVC)
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Continue'
          & meson compile -C build-msvc --verbose 2>&1 | Tee-Object -FilePath build-msvc-compile.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Write-Host "MSVC/Ninja compilation failed with exit code $buildExit"
            Get-Content build-msvc-compile.log -Tail 180
            exit $buildExit
          }

      - name: Verify expected Windows binaries
        shell: pwsh
        working-directory: source
        run: |
          $expected = @(
            'build-msvc/src/MangoHud.dll',
            'build-msvc/src/MangoHudLauncher.exe',
            'build-msvc/src/MangoHudControl.exe',
            'build-msvc/src/dxgi.dll',
            'build-msvc/src/MangoHud.exe',
            'build-msvc/src/MangoHud.x86_64.json'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Falta el binario esperado: $file"
            }
            Get-Item -LiteralPath $file | Select-Object FullName, Length
          }

      - name: Package experimental Windows preview
        shell: pwsh
        working-directory: source
        run: |
          ./dev/package_windows.ps1 -BuildDirectory build-msvc -PackageDirectory package

          # Bundle the four original Windows-port skins plus four Catppuccin community palettes.
          # Dark remains the fresh-install default; Dark and Minimal are unchanged.
          $skinsSource = Join-Path $env:GITHUB_WORKSPACE '.github\windows-installer\skins'
          $skinsDestination = Join-Path (Get-Location).Path 'package\skins'
          New-Item -ItemType Directory -Path $skinsDestination -Force | Out-Null
          $skinFiles = @(
            'Dark.conf',
            'Mango.conf',
            'Minimal.conf',
            'Glass.conf',
            'Catppuccin-Latte.conf',
            'Catppuccin-Frappé.conf',
            'Catppuccin-Macchiato.conf',
            'Catppuccin-Mocha.conf',
            'Catppuccin-LICENSE.txt'
          )
          foreach ($skin in $skinFiles) {
            $skinPath = Join-Path $skinsSource $skin
            if (-not (Test-Path -LiteralPath $skinPath)) { throw "Missing skin or license: $skinPath" }
            Copy-Item -LiteralPath $skinPath -Destination (Join-Path $skinsDestination $skin) -Force
          }
          Copy-Item -LiteralPath (Join-Path $skinsSource 'Dark.conf') -Destination 'package\config\MangoHud.conf' -Force
          $skinReadme = "`nHUD SKINS`n- Open MangoHudControl.exe and select Dark, Mango, Minimal, Glass or one of the four Catppuccin palettes under APARIENCIA DEL HUD.`n- Dark remains the default. The original Dark and Minimal skins are unchanged.`n- Catppuccin configurations are adapted from catppuccin/mangohud and their MIT attribution/license is in skins\Catppuccin-LICENSE.txt.`n- The selection is saved and the connected HUD reloads on its next frame; new connections use the selected skin too.`n"
          $packageReadme = 'package\README-EXPERIMENTAL.txt'
          if (Test-Path -LiteralPath $packageReadme) {
            Add-Content -LiteralPath $packageReadme -Value $skinReadme -Encoding UTF8
          }
          Write-Host 'Eight HUD skins and Catppuccin attribution copied and verified.'
          foreach ($skin in $skinFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $skinsDestination $skin))) {
              throw "Skin or license was not packaged: $skin"
            }
          }
          if (-not (Test-Path -LiteralPath 'package\config\MangoHud.conf')) {
            throw 'Default MangoHud.conf missing after skin packaging.'
          }
          $zip = 'MangoHud-Windows-v2-prueba-NO-INSTALAR.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw 'No se generó el ZIP de prueba' }
          Get-Item -LiteralPath $zip | Select-Object FullName, Length

      - name: Prepare branded installer assets
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:GITHUB_WORKSPACE '.github\windows-installer\assets'
          function Expand-GzipBase64Asset([string]$sourceName, [string]$destinationName, [byte[]]$signature) {
            $sourcePath = Join-Path $assetDir $sourceName
            $destinationPath = Join-Path $assetDir $destinationName
            $encoded = (Get-Content -LiteralPath $sourcePath -Raw).Trim()
            $compressed = [Convert]::FromBase64String($encoded)
            $inputStream = [System.IO.MemoryStream]::new($compressed)
            $gzip = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
            $outputStream = [System.IO.MemoryStream]::new()
            try {
              $gzip.CopyTo($outputStream)
              $bytes = $outputStream.ToArray()
            } finally {
              $gzip.Dispose()
              $inputStream.Dispose()
              $outputStream.Dispose()
            }
            if ($bytes.Length -lt $signature.Length) { throw "Asset is empty: $sourceName" }
            for ($i = 0; $i -lt $signature.Length; $i++) {
              if ($bytes[$i] -ne $signature[$i]) { throw "Invalid file signature for $destinationName" }
            }
            [System.IO.File]::WriteAllBytes($destinationPath, $bytes)
            Get-Item -LiteralPath $destinationPath | Select-Object Name, Length
          }
          Expand-GzipBase64Asset 'MangoHud.ico.gz.b64' 'MangoHud.ico' ([byte[]](0,0,1,0))
          Expand-GzipBase64Asset 'WizardImage.bmp.gz.b64' 'WizardImage.bmp' ([byte[]](66,77))
          Expand-GzipBase64Asset 'WizardSmallImage.bmp.gz.b64' 'WizardSmallImage.bmp' ([byte[]](66,77))

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github\windows-installer\MangoHud-Windows.iss'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'installer-output'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'source\package'
          if (-not (Test-Path -LiteralPath $source)) { throw "No se encuentra el script Inno Setup: $source" }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'bin\MangoHud.dll'))) {
            throw 'El paquete no contiene bin\MangoHud.dll'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'bin\MangoHudLauncher.exe'))) {
            throw 'El paquete no contiene MangoHudLauncher.exe'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'MangoHudControl.exe'))) {
            throw 'El paquete no contiene MangoHudControl.exe'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'MangoHud.ico'))) {
            throw 'El paquete no contiene MangoHud.ico'
          }
          $assetDir = Join-Path $env:GITHUB_WORKSPACE '.github\windows-installer\assets'
          foreach ($asset in @('MangoHud.ico', 'WizardImage.bmp', 'WizardSmallImage.bmp')) {
            if (-not (Test-Path -LiteralPath (Join-Path $assetDir $asset))) {
              throw "Falta el recurso visual del instalador: $asset"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source\LICENSE'))) {
            throw 'No se encuentra la licencia de MangoHud en el paquete de fuentes'
          }
          choco install innosetup --no-progress --yes
          $isccCandidates = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'No se encontró ISCC.exe después de instalar Inno Setup.' }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          & $iscc /Qp $source
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló con código $LASTEXITCODE" }
          $setupExe = Join-Path $outDir 'MangoHud-Windows-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setupExe)) { throw "No se generó el instalador esperado: $setupExe" }
          Get-Item -LiteralPath $setupExe | Select-Object FullName, Length

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MangoHud-Windows-Setup-x64
          path: installer-output/MangoHud-Windows-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload experimental preview package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MangoHud-Windows-v2-prueba-NO-INSTALAR
          path: source/MangoHud-Windows-v2-prueba-NO-INSTALAR.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Meson diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MangoHud-Windows-v2-msvc-diagnostics
          path: |
            source/build-msvc/meson-logs/meson-log.txt
            source/build-msvc/meson-logs/meson-log.json
            source/build-msvc-compile.log
          if-no-files-found: warn
          retention-days: 14
