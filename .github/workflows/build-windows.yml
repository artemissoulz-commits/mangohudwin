
name: Compilar MangoHud Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Instalar herramientas
        run: |
          pacman -Syu --noconfirm \
            mingw-w64-gcc meson ninja \
            python-mako glslang \
            mingw-w64-headers git unzip \
            ca-certificates pkgconf

      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: bash
        run: |
          mkdir -p extraido
          ZIP=$(find . -maxdepth 2 -name '*.zip' \
            -type f | head -n 1)
          test -n "$ZIP" || exit 1
          unzip -q "$ZIP" -d extraido

      - name: Compilar para Windows
        shell: bash
        run: |
          FILE=$(find extraido -name mingw64.txt \
            -type f | head -n 1)
          test -n "$FILE" || exit 1
          cd "$(dirname "$FILE")"
          meson setup --cross-file mingw64.txt \
            build64 --buildtype=release
          ninja -C build64
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          find build64 -type f \( \
            -iname '*.dll' -o -iname '*.exe' \
          \) -exec cp '{}' \
            "$GITHUB_WORKSPACE/resultado/" \;
          test -n "$(ls -A "$GITHUB_WORKSPACE/resultado")"

      - name: Guardar compilación
        uses: actions/upload-artifact@v4
        with:
          name: MangoHud-Windows-Experimental
          path: resultado/
          if-no-files-found: error
