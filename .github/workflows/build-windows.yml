
name: MangoHud Windows - MSVC x64 (D3D11-D3D12-Vulkan)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install glslang for shader compilation
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-glslang

      - name: Add glslang to PATH
        shell: pwsh
        run: |
          $glslangDir = 'C:\msys64\ucrt64\bin'
          if (-not (Test-Path (Join-Path $glslangDir 'glslangValidator.exe'))) {
            throw "No se encontró glslangValidator en $glslangDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $glslangDir
          & (Join-Path $glslangDir 'glslangValidator.exe') --version

      - name: Configure Microsoft C++ x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Extract Windows source package
        shell: pwsh
        run: |
          $zip = 'MangoHud-Windows-Source-Port-v2.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "No se encuentra $zip en la raíz del repositorio"
          }
          if (Test-Path -LiteralPath 'source') {
            Remove-Item -LiteralPath 'source' -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip -DestinationPath 'source' -Force
          if (-not (Test-Path -LiteralPath 'source/meson.build')) {
            throw 'El ZIP no es válido: falta source/meson.build en su raíz'
          }
          git -C source init
          git -C source add --all
          git -C source -c user.name='GitHub Actions' -c user.email='actions@github.local' commit -m 'Source archive snapshot'
          git -C source tag v0.8.3

      - name: Run static Windows port checks
        shell: pwsh
        working-directory: source
        run: |
          python dev/check_windows_port.py
          $workflow = Get-Content -LiteralPath '..\build-windows.yml' -Raw
          foreach ($required in @(
            'MangoHud-Windows-Source-Port-v2.zip',
            'MangoHud-Windows-v2-prueba-NO-INSTALAR',
            'ilammy/msvc-dev-cmd@v1',
            'meson compile -C build-msvc'
          )) {
            if (-not $workflow.Contains($required)) {
              throw "El workflow externo no contiene el elemento esperado: $required"
            }
          }

      - name: Install Meson, Ninja and Mako
        shell: pwsh
        run: python -m pip install --upgrade meson ninja mako

      - name: Configure MSVC x64 build
        shell: pwsh
        working-directory: source
        run: |
          meson setup build-msvc --buildtype=release --backend=ninja `
            -Db_vscrt=mt `
            -Dtests=disabled `
            -Dinclude_doc=false

      - name: Compile Windows targets (MSVC)
        shell: pwsh
        working-directory: source
        run: meson compile -C build-msvc --verbose

      - name: Verify expected Windows binaries
        shell: pwsh
        working-directory: source
        run: |
          $expected = @(
            'build-msvc/src/MangoHud.dll',
            'build-msvc/src/dxgi.dll',
            'build-msvc/src/MangoHud.exe',
            'build-msvc/src/MangoHud.x86_64.json'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Falta el binario esperado: $file"
            }
            Get-Item -LiteralPath $file | Select-Object FullName, Length
          }

      - name: Package experimental Windows preview
        shell: pwsh
        working-directory: source
        run: |
          ./dev/package_windows.ps1 -BuildDirectory build-msvc -PackageDirectory package
          $zip = 'MangoHud-Windows-v2-prueba-NO-INSTALAR.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw 'No se generó el ZIP de prueba' }
          Get-Item -LiteralPath $zip | Select-Object FullName, Length

      - name: Upload experimental preview package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MangoHud-Windows-v2-prueba-NO-INSTALAR
          path: source/MangoHud-Windows-v2-prueba-NO-INSTALAR.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Meson diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MangoHud-Windows-v2-msvc-diagnostics
          path: |
            source/build-msvc/meson-logs/meson-log.txt
            source/build-msvc/meson-logs/meson-log.json
          if-no-files-found: warn
          retention-days: 14
